# استقرار Production روی VPS — بدون دامنه (فقط IP، پورت ۸۰)
# اجرا: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# ⚠️ برخلاف docker-compose.yml (توسعه): پورت پستگرس و API مستقیم به بیرون منتشر نمی‌شن —
# فقط سرویس web (nginx، پورت ۸۰) از بیرون در دسترسه؛ بقیه فقط داخل شبکه Docker.
#
# P0-E1-F1-T1 -- TLS now terminates at a new 'caddy' service in front of
# 'web'; only caddy (ports 80/443) is published to the host. web/api/
# postgres/redis all stay internal-network-only.

services:
  postgres:
    image: postgres:16-alpine
    container_name: septa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: septa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: septa
    volumes:
      - septa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U septa -d septa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # P1-E3-F1-T1 — Redis: cache/queue/pub-sub infrastructure for Phase 2 work;
  # not used for anything yet beyond the health check. Password-protected,
  # not published to the host (same "internal-network-only" policy as
  # postgres above).
  redis:
    image: redis:7-alpine
    container_name: septa_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - septa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # P1-E1-F2-T3 — migrations are now part of the deploy graph, not a manual step an
  # operator has to remember. This is a one-shot job (runs once per `docker compose up`,
  # exits 0, is not itself a long-running service) that `api` waits on below via
  # `service_completed_successfully` — requires Docker Compose v2.20+.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: septa_migrate
    restart: "no"
    env_file:
      - apps/api/.env.production
    environment:
      DATABASE_URL: postgresql://septa:${POSTGRES_PASSWORD}@postgres:5432/septa?schema=public
    working_dir: /app/apps/api
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: septa_api
    restart: unless-stopped
    env_file:
      - apps/api/.env.production
    environment:
      # داخل شبکه Docker هاست پستگرس "postgres" است، نه localhost
      DATABASE_URL: postgresql://septa:${POSTGRES_PASSWORD}@postgres:5432/septa?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      # ⚠️ StorageService با process.cwd() کار می‌کنه؛ چون CMD از WORKDIR /app اجرا می‌شه،
      # مسیر واقعی /app/uploads است (نه apps/api/uploads) — این مسیر باید دقیق بمونه
      - septa_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # اگه migrate شکست بخوره (خطای Migration)، api اصلاً بالا نمیاد — به‌جای اینکه
      # با اسکیمای قدیمی روی داده جدید اجرا بشه و خطای ناشناخته بده
      migrate:
        condition: service_completed_successfully
    # P1-E2-F1-T1 — curl/wget aren't installed in this image (only
    # ca-certificates/fonts-liberation/chromium are, for Puppeteer), so the
    # check uses Node's own http module instead of shelling out to either.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: septa_web
    restart: unless-stopped
    # P0-E1-F1-T1 — no longer publishes port 80 to the host directly; Caddy
    # is now the only thing exposed, terminating TLS in front of it.
    depends_on:
      - api

  # P0-E1-F1-T1 — TLS termination. Only Caddy is published to the host now;
  # web (nginx) and api stay internal-network-only, same policy postgres/
  # redis already had.
  caddy:
    image: caddy:2-alpine
    container_name: septa_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - septa_caddy_data:/data
      - septa_caddy_config:/config
    depends_on:
      - web

volumes:
  septa_postgres_data:
  septa_uploads:
  septa_redis_data:
  septa_caddy_data:
  septa_caddy_config:
