# ⚠️ 127.0.0.11 = DNS داخلی خود Docker. با یک متغیر (نه هاست ثابت در proxy_pass) هر
# درخواست دوباره Resolve می‌شه — وگرنه nginx فقط یک‌بار موقع استارت آی‌پی "api" رو
# می‌گیره: اگه api هنوز بالا نیومده باشه nginx اصلاً بالا نمیاد، و اگه بعداً کانتینر api
# دوباره ساخته بشه (مثلاً در یک Deploy جدید) nginx با آی‌پی قدیمی/مرده گیر می‌کنه
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # پیوست‌ها تا ۲۰ مگ (MAX_FILE_SIZE_BYTES در storage.service.ts) — کمی حاشیه اضافه
    client_max_body_size 25m;

    # پروکسی API — سرویس "api" در همون شبکه Docker Compose
    location /api/ {
        set $upstream_api api:3000;
        # ⚠️ چون proxy_pass با یک متغیر (نه هاست ثابت) نوشته شده، nginx دیگه پیشوند
        # location رو خودکار جایگزین نمی‌کنه (رفتار مستندشده nginx) — بدون این rewrite،
        # هر درخواستی (صرف‌نظر از مسیر واقعی) دقیقاً به "/" روی api فوروارد می‌شد
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # کوکی Refresh Token با Path=/auth از بک‌اند ست می‌شه؛ چون از مسیر /api/auth/...
        # صدا زده می‌شه، Path باید به همون شکل روی مرورگر بازنویسی بشه وگرنه کوکی
        # اصلاً برای درخواست‌های بعدی /api/auth/refresh فرستاده نمی‌شه
        proxy_cookie_path /auth /api/auth;

        # آپلود فایل هم از همین مسیر رد می‌شه
        client_max_body_size 25m;
    }

    # SPA — هر مسیر ناشناخته به index.html (React Router سمت کلاینت مسیریابی می‌کنه)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
