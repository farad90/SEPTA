# ⚠️ 127.0.0.11 = DNS داخلی خود Docker. با یک متغیر (نه هاست ثابت در proxy_pass) هر
# درخواست دوباره Resolve می‌شه — وگرنه nginx فقط یک‌بار موقع استارت آی‌پی "api" رو
# می‌گیره: اگه api هنوز بالا نیومده باشه nginx اصلاً بالا نمیاد، و اگه بعداً کانتینر api
# دوباره ساخته بشه (مثلاً در یک Deploy جدید) nginx با آی‌پی قدیمی/مرده گیر می‌کنه
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # پیوست‌ها تا ۲۰ مگ (MAX_FILE_SIZE_BYTES در storage.service.ts) — کمی حاشیه اضافه
    client_max_body_size 25m;

    # پروکسی API — سرویس "api" در همون شبکه Docker Compose
    location /api/ {
        set $upstream_api api:3000;
        # ⚠️ چون proxy_pass با یک متغیر (نه هاست ثابت) نوشته شده، nginx دیگه پیشوند
        # location رو خودکار جایگزین نمی‌کنه (رفتار مستندشده nginx) — بدون این rewrite،
        # هر درخواستی (صرف‌نظر از مسیر واقعی) دقیقاً به "/" روی api فوروارد می‌شد
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # کوکی Refresh Token با Path=/auth از بک‌اند ست می‌شه؛ چون از مسیر /api/auth/...
        # صدا زده می‌شه، Path باید به همون شکل روی مرورگر بازنویسی بشه وگرنه کوکی
        # اصلاً برای درخواست‌های بعدی /api/auth/refresh فرستاده نمی‌شه
        proxy_cookie_path /auth /api/auth;

        # آپلود فایل هم از همین مسیر رد می‌شه
        client_max_body_size 25m;
    }

    # SPA — هر مسیر ناشناخته به index.html (React Router سمت کلاینت مسیریابی می‌کنه)
    location / {
        try_files $uri $uri/ /index.html;

        # P1-E4-F3-T3 — baseline security headers for the actual HTML document
        # (the API gets its own copies via helmet in apps/api/src/main.ts;
        # scoped to this location only so they don't also apply to the /api/
        # proxy above and end up duplicated alongside helmet's).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # ⚠️ script-src allows exactly one inline script by its SHA-256 hash —
        # the theme-preload snippet in apps/web/index.html (phase 41-الف,
        # prevents a flash of the default theme before React mounts). If that
        # script's content ever changes, this hash goes stale and the browser
        # silently blocks it (graceful degradation to default theme, not a
        # crash — but it should still be fixed). Regenerate with:
        #   node -e "const c=require('fs').readFileSync('apps/web/index.html','utf8').match(/<script>([\s\S]*?)<\/script>/)[1]; console.log('sha256-'+require('crypto').createHash('sha256').update(c).digest('base64'))"
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-PN/1R06KF5DYk4kZU8l6kXqp3ubChqc293XuMOMZ33A='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    }
}
