services:
  postgres:
    image: postgres:16-alpine
    container_name: septa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: septa
      POSTGRES_PASSWORD: septa_dev_password
      POSTGRES_DB: septa
    ports:
      - "5432:5432"
    volumes:
      - septa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U septa -d septa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: septa_api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      # داخل شبکه Docker، هاست پستگرس "postgres" است، نه localhost — این مقدار
      # env_file بالا رو override می‌کنه.
      DATABASE_URL: postgresql://septa:septa_dev_password@postgres:5432/septa?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # P1-E2-F1-T1 — curl/wget aren't installed in the api image (only
    # ca-certificates/fonts-liberation/chromium are, for Puppeteer), so the
    # check uses Node's own http module instead of shelling out to either.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  septa_postgres_data:
