name: CI

# P1-E1-F1-T1 — every push and PR gets an automated lint/test/build gate.
# Previously there was no CI at all; the 34+ backend unit tests only ran
# if a developer remembered to run them locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values only — satisfy env.validation.ts's required fields (DATABASE_URL,
  # CORS_ORIGIN, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET) in case any test bootstraps
  # the full ConfigModule. Never real secrets; CI never talks to a real database.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder?schema=public"
  CORS_ORIGIN: "http://localhost:5173"
  JWT_ACCESS_SECRET: "ci-only-placeholder-access-secret-not-real"
  JWT_REFRESH_SECRET: "ci-only-placeholder-refresh-secret-not-real"

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (for the pinned pnpm version)
        run: corepack enable

      - name: Setup Node.js (version pinned in .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Prisma Client is generated into apps/api/generated/prisma, which is
      # gitignored — nest build and ts-jest both fail to type-check without it.
      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Test — API (Jest)
        run: pnpm --filter api run test

      - name: Test — Web (Vitest)
        run: pnpm --filter web run test

      - name: Build
        run: pnpm build

      # P1-E4-F2-T2 — dependency vulnerability scanning. Report-only for now
      # (continue-on-error), NOT a blocking gate: as of this task, the
      # existing dependency tree already has 41 known advisories (1 critical
      # — vitest's UI-server RCE, irrelevant here since this project only
      # ever runs `vitest run`, never the UI server; 18 high, mostly a
      # transitive brace-expansion ReDoS pulled in via eslint/@nestjs/cli/
      # exceljs's dependency chains, not directly controllable without
      # upgrading those top-level packages — several of which are major-
      # version bumps with real breaking-change risk). Blocking merges on
      # pre-existing debt this task merely discovered, rather than
      # introduced, isn't the right call — Dependabot (configured alongside
      # this) will propose the actual fixes incrementally instead. Revisit
      # turning this into a hard gate once that backlog is worked down.
      - name: Dependency audit (report-only)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  # P1-E1-F2-T2 — build and tag Docker images in CI on merge to main.
  # Replaces the old "tar the repo and scp it to the VPS as root" deploy path
  # with tagged, provenance-tracked images: `docker inspect <image>` can now
  # always answer "what commit is this?" instead of nobody being able to tell.
  build-and-push:
    name: Build & push images (main only)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
