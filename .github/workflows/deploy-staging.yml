name: Deploy to Staging

# P1-E1-F3-T4 — every merge to main deploys automatically to staging (never to
# production — that stays a manual promotion step, deliberately, as the safety
# gate). Runs after ci.yml's build-and-push job has published a tagged image.
#
# ⚠️ Requires these repository secrets to be configured before this workflow can
# actually run (Settings → Secrets and variables → Actions):
#   STAGING_SSH_HOST  — the staging VPS's address
#   STAGING_SSH_USER  — a deploy user on that host (not root — see P1-E1-F2-T2's
#                        note on privilege separation; this workflow assumes that
#                        hardening has already happened)
#   STAGING_SSH_KEY   — the private key for that user
# None of these exist yet — there is no staging host provisioned as of
# 2026-08-09 (production, 91.223.61.70, is deployed by deploy-production.yml
# instead, directly from source — see that file's header for why). Trigger is
# manual-only (workflow_dispatch) for exactly this reason: with the automatic
# workflow_run trigger this used to have, it fired on every push to main and
# failed with "missing server host" every single time (confusing noise, no
# real harm since the empty-secret failure never touches any server) — this
# is code-complete and ready to switch back to workflow_run once a real
# staging host + these three secrets actually exist.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/septa-staging
            export GHCR_IMAGE_BASE=ghcr.io/${{ github.repository }}
            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
            docker compose --env-file .env.staging -f docker-compose.staging.yml pull
            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
            docker image prune -f
