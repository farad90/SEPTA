version: 2
updates:
  # P1-E4-F2-T2 — API dependencies (npm/pnpm ecosystem covers both).
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "api"]

  # Web dependencies.
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "web"]

  # The GitHub Actions themselves (actions/checkout, docker/build-push-action,
  # etc., introduced in P1-E1-F1-T1/F2-T2) — these need updates too, and are a
  # separate ecosystem from npm.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
